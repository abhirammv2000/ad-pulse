# Lint for the Python services. The rules are the ones that find real mistakes: syntax errors, undefined names,
# unused imports and variables, and a few pycodestyle errors that are bugs (bare except, comparison to None).
# Style rules such as import order and line length are left off on purpose, so turning this on does not mean
# rewriting files that work.
line-length = 120

extend-exclude = ["ad-manager-frontend", "ad-devops"]

[lint]
select = ["E4", "E7", "E9", "F"]
