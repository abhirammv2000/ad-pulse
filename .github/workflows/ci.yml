name: CI

# Runs the tests for every service on each push and pull request. The two
# deploy workflows (main.yaml and build_push.yml) only run on their own branches.

on:
  push:
    branches: [main, stage]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ad-manager-svc/requirements.txt
            adpulse-engagement-subscriber-svc/requirements.txt
            ad-refresh-cache-svc/requirements.txt

      - name: Install dependencies
        run: |
          pip install \
            -r ad-manager-svc/requirements.txt \
            -r adpulse-engagement-subscriber-svc/requirements.txt \
            -r ad-refresh-cache-svc/requirements.txt \
            coverage ruff==0.17.0

      # The rules in ruff.toml find real mistakes (undefined names, unused imports), not style.
      - name: Lint
        run: ruff check .

      # Each service prints a coverage table after its tests. It is a report, with no minimum to meet.
      - name: ad-manager-svc
        working-directory: ad-manager-svc
        run: |
          python -m coverage run --source=. --omit="*/test/*,migrations/*" -m unittest discover -s app/test -p "*_test.py"
          python -m coverage report

      - name: adpulse-engagement-subscriber-svc
        working-directory: adpulse-engagement-subscriber-svc
        run: |
          python -m coverage run --source=. --omit="*/tests/*" -m unittest discover -s tests -p "*_test.py"
          python -m coverage report

      - name: ad-refresh-cache-svc
        working-directory: ad-refresh-cache-svc
        run: |
          python -m coverage run --source=. --omit="*/tests/*" -m unittest discover -s tests -p "*_test.py"
          python -m coverage report

  go:
    name: Go services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ad-server-svc, adpulse-engagement-svc]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "These files need gofmt:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: go test -run "^$" -bench . -benchtime 1x ./...  # benchmarks must keep compiling and running

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adpulse
          POSTGRES_PASSWORD: adpulse
          POSTGRES_DB: adpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://adpulse:adpulse@localhost:5432/adpulse
      PGPASSWORD: adpulse
    defaults:
      run:
        working-directory: ad-manager-svc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ad-manager-svc/requirements.txt

      - run: pip install -r requirements.txt

      # `alembic check` fails if the models and the database differ, so a model change that comes without a
      # migration fails here.
      - name: A new database reaches the models' schema by migration
        run: |
          alembic upgrade head
          alembic check

      - name: Going down and up again works
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

      # A database that init_db() created is stamped, not migrated. It has to be the same schema as the migration.
      - name: A database the service created matches the migration
        run: |
          psql -h localhost -U adpulse -d postgres -c "CREATE DATABASE created_by_the_service"
          export DATABASE_URL=postgresql://adpulse:adpulse@localhost:5432/created_by_the_service
          python -c "from config.db import init_db; init_db()"
          alembic stamp head
          alembic check

  # Starts the real services in Docker Compose (with the API key and signed tracking URLs on) and runs
  # integration_test.py through them: create, cache, serve, click, render, report.
  end-to-end:
    name: End to end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f ad-devops/deployments/docker-compose.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests

      - name: Start the services
        run: ${{ env.COMPOSE }} up --build -d ad-manager-svc ad-refresh-cache-svc ad-server-svc adpulse-engagement-svc adpulse-engagement-subscriber-svc ad-manager-frontend

      - name: Wait until the services answer
        run: |
          for url in http://localhost:5000/health http://localhost:8080/ http://localhost:8081/health http://localhost:3000/health; do
            for i in $(seq 1 60); do
              if curl -fsS -o /dev/null "$url"; then echo "up: $url"; break; fi
              if [ "$i" = 60 ]; then echo "never came up: $url"; exit 1; fi
              sleep 3
            done
          done

      - name: Run the integration test
        env:
          AD_MANAGER_HOST: http://localhost:5000
          AD_SERVER_HOST: http://localhost:8080
          AD_MANAGER_API_KEY: local-dev-api-key
        run: python -m unittest integration_test -v

      # The dashboard's own tests run in jsdom, which cannot see a production bundle that fails to render (that
      # happened once, from a bundler setting). This opens the real image in Chromium and walks through the API key
      # dialog. playwright is installed in a scratch folder, so it is not a dependency of the dashboard.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Dashboard smoke test in a real browser
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cp ad-manager-frontend/smoke/smoke.mjs "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --no-fund --no-audit playwright@1.64.0
          npx playwright install --with-deps chromium
          node smoke.mjs

      # The manager must refuse a request with no key when API_KEY is set, or the test above proves nothing about it.
      - name: The manager refuses a request without the key
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/publisher)
          if [ "$code" != 401 ]; then echo "expected 401, got $code"; exit 1; fi

      - name: Logs
        if: failure()
        run: ${{ env.COMPOSE }} logs --no-color --tail=200

      - name: Stop the services
        if: always()
        run: ${{ env.COMPOSE }} down -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ad-manager-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ad-manager-frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: Lint
        run: helm lint ad-devops/helm/ad-pulse

      # The rendered manifests are checked against the Kubernetes 1.30 API schemas, so a wrong field name or a
      # wrong apiVersion fails here and not on a cluster.
      - name: Render and validate
        run: |
          helm template ci ad-devops/helm/ad-pulse > rendered.yaml
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary -kubernetes-version 1.30.0 - < rendered.yaml
