name: Build and Push to Docker Hub

on:
    push:
        branches:
            - stage

env:
    DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:
    unit-tests:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
          with:
            ref: stage
            fetch-depth: 5

        - name: Run ad-manager-svc unit tests
          run: |
            cd ad-manager-svc
            pip install -r requirements.txt
            python3 -m unittest discover -s app/test -p "*_test.py"

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version-file: ad-server-svc/go.mod

        - name: Run ad-server-svc tests
          run: cd ad-server-svc && go test ./...

        - name: Run adpulse-engagement-svc tests
          run: cd adpulse-engagement-svc && go test ./...

        - name: Set up Node
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'
            cache-dependency-path: ad-manager-frontend/package-lock.json

        - name: Run ad-manager-frontend unit tests
          run: |
            cd ad-manager-frontend
            npm ci
            npm test -- --watchAll=false

    check-changes-and-build:
      runs-on: ubuntu-latest
      needs: unit-tests
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
          with:
            ref: stage
            fetch-depth: 5

        - name: print
          run: |
            echo "Before: ${{ github.event.before }}"
            echo "After: ${{ github.sha }}"
            echo "Branch: $(git branch --show-current)"

        # Every changed top-level service folder, one per line, written to
        # $GITHUB_ENV (the old `::set-env::` command this replaced was
        # disabled by GitHub in 2020 and only worked here because the
        # workflow re-enabled it via ACTIONS_ALLOW_UNSECURE_COMMANDS). Each
        # match is appended, not overwritten, so a push touching more than
        # one service builds all of them instead of just the last one found.
        - name: Get list of folders
          id: list_folders
          run: |
                folders=""
                for dir in */; do
                  dir=${dir%/}
                  case "$dir" in .*|ad-devops) continue ;; esac
                  if [ -n "$(git diff --name-only HEAD^ HEAD -- "$dir")" ]; then
                    folders="$folders$dir"$'\n'
                  fi
                done
                echo "Folders:"
                echo "$folders"
                {
                  echo "FOLDERS<<EOF_FOLDERS"
                  printf '%s' "$folders"
                  echo "EOF_FOLDERS"
                } >> "$GITHUB_ENV"

        - name: Bump version
          run: |
                if [ -n "$FOLDERS" ]; then
                  bumped=""
                  while read -r dir; do
                    [ -z "$dir" ] && continue
                    old_version=$(cat "$dir/version.txt")
                    regex="([0-9]+)\.([0-9]+)\.([0-9]+)"
                    if [[ $old_version =~ $regex ]]; then
                        major="${BASH_REMATCH[1]}"
                        minor="${BASH_REMATCH[2]}"
                        patch="${BASH_REMATCH[3]}"
                        new_patch=$((patch + 1))
                        new_version="${major}.${minor}.${new_patch}"
                        echo "$dir: $old_version -> $new_version"
                        echo "$new_version" > "$dir/version.txt"
                        bumped="$bumped$dir:$new_version, "
                    else
                        echo "Invalid version format in $dir/version.txt: $old_version"
                    fi
                  done <<< "$FOLDERS"
                  echo "BUMPED=$bumped" >> "$GITHUB_ENV"
                else
                  echo "No changes detected"
                fi

        - name: Commit changes
          run: |
            if [ -n "$FOLDERS" ]; then
              git config --global user.name "GitHub Actions"
              git config --global user.email "actions@github.com"
              git add .
              # [skip ci] stops GitHub Actions from triggering another run for
              # this push - without it, this commit changes version.txt in the
              # same folder that was just detected as changed, which would
              # trigger this workflow again, bump again, and loop forever.
              git commit -m "Bump version: ${BUMPED%, } [skip ci]"
              git push https://${{ secrets.PAT }}@github.com/${{ github.repository }} HEAD:stage
            else
                echo "No changes detected"
            fi

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v1

        - name: Login to Docker Hub
          run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
  
        - name: Build and push Docker images
          run: |
            if [ -n "$FOLDERS" ]; then
              while read -r dir; do
                [ -z "$dir" ] && continue
                docker buildx build \
                  --platform linux/amd64,linux/arm64 \
                  --push \
                  -t ${{ secrets.DOCKER_USERNAME }}/$dir:$(cat $dir/version.txt) \
                  -f $dir/Dockerfile \
                  $dir
              done <<< "$FOLDERS"
            else
              echo "No changes detected"
            fi
        - name: sleeping 30 seconds
          run: sleep 30

    update-helm-chart:
      needs: check-changes-and-build
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v2
          with:
            ref: stage
            fetch-depth: 5

        - name: install yq
          run: |
            wget https://github.com/mikefarah/yq/releases/download/v4.12.0/yq_linux_amd64.tar.gz -O /tmp/yq.tar.gz
            tar xvf /tmp/yq.tar.gz -C /tmp/
            mv /tmp/yq_linux_amd64 /usr/local/bin/yq
            chmod +x /usr/local/bin/yq

        - name: Update Helm chart
          run: |
            yq eval '.adpulse.ad_manager_svc.image.tag = "'"$(cat ad-manager-svc/version.txt)"'"' -i ./ad-devops/helm/ad-pulse/values.yaml
            yq eval '.adpulse.ad_manager_frontend.image.tag = "'"$(cat ad-manager-frontend/version.txt)"'"' -i ./ad-devops/helm/ad-pulse/values.yaml
            yq eval '.adpulse.adpulse_engagement_svc.image.tag = "'"$(cat adpulse-engagement-svc/version.txt)"'"' -i ./ad-devops/helm/ad-pulse/values.yaml
            yq eval '.adpulse.ad_server_svc.image.tag = "'"$(cat ad-server-svc/version.txt)"'"' -i ./ad-devops/helm/ad-pulse/values.yaml
            yq eval '.adpulse.adpulse_engagement_subscriber_svc.image.tag = "'"$(cat adpulse-engagement-subscriber-svc/version.txt)"'"' -i ./ad-devops/helm/ad-pulse/values.yaml
            yq eval '.adpulse.ad_refresh_cache_svc.image.tag = "'"$(cat ad-refresh-cache-svc/version.txt)"'"' -i ./ad-devops/helm/ad-pulse/values.yaml

        - name: Commit changes
          run: |
            if [ -n "$(git status --porcelain)" ]; then
              git config --global user.name "GitHub Actions"
              git config --global user.email "actions@github.com"
              git add .
              git commit -m "Updating helm chart values.yaml [skip ci]"
              git push https://${{ secrets.PAT }}@github.com/${{ github.repository }} HEAD:stage
            else
              echo "No changes detected."
            fi

        - name: sleeping 30 seconds
          run: sleep 30
            

    deploy:
      needs: update-helm-chart
      runs-on: ubuntu-latest
      
      steps:
      - name: Checkout repository
        uses: actions/checkout@v2
  
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v0.2.0
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY_STAGE }}
          project_id: ${{ vars.GCP_PROJECT_ID_STAGE }}
          export_default_credentials: true
        
      - name: Install kubectl
        run: |
          gcloud components install kubectl
          gcloud components install gke-gcloud-auth-plugin
      
      - name: Authenticate with Google Cloud
        run: |
          printf "%s" '${{ secrets.GCP_SA_KEY_STAGE }}' > key.json
          gcloud auth activate-service-account --key-file=key.json

  
      - name: Set up Kubernetes cluster context
        run: gcloud container clusters get-credentials ${{ vars.GCP_CLUSTER_NAME_STAGE }} --zone ${{ vars.GCP_CLUSTER_ZONE_STAGE}} --project ${{ vars.GCP_PROJECT_ID_STAGE }}
  
      - name: Configure Helm and add kube-prometheus-stack repository
        run: |
          helm repo add stable https://charts.helm.sh/stable
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
  
      - name: Upgrade Helm chart
        # Credentials come from repo/environment secrets, never from values.yaml
        # (see ad-devops/helm/ad-pulse/templates/secrets.yaml). Configure these
        # under Settings > Secrets and variables > Actions before this runs.
        run: |
          helm upgrade --install stage ./ad-devops/helm/ad-pulse --values ./ad-devops/helm/ad-pulse/values.yaml --namespace=adpulse \
            --set ad_server_url="${{ vars.AD_SERVER_URL_STAGE || 'http://34.31.128.115:8080' }}" \
            --set ad_manager_url="${{ vars.AD_MANAGER_URL_STAGE || 'http://34.67.120.91:5000' }}" \
            --set ad_engagement_svc_clk="${{ vars.ENGAGEMENT_URL_STAGE || 'http://34.30.188.53:8081' }}/engagement/clk" \
            --set ad_engagement_svc_rndr="${{ vars.ENGAGEMENT_URL_STAGE || 'http://34.30.188.53:8081' }}/engagement/csc" \
            --set-string adpulse.secrets.databaseUrl="${{ secrets.DATABASE_URL_STAGE }}" \
            --set-string adpulse.secrets.mongodbUri="${{ secrets.MONGODB_URI_STAGE }}" \
            --set-string adpulse.secrets.redisHost="${{ secrets.REDIS_HOST_STAGE }}" \
            --set-string adpulse.secrets.redisPort="${{ secrets.REDIS_PORT_STAGE }}" \
            --set-string adpulse.secrets.redisUsername="${{ secrets.REDIS_USERNAME_STAGE }}" \
            --set-string adpulse.secrets.redisPassword="${{ secrets.REDIS_PASSWORD_STAGE }}" \
            --set-string adpulse.secrets.supabaseUrl="${{ secrets.SUPABASE_URL }}" \
            --set-string adpulse.secrets.supabaseKey="${{ secrets.SUPABASE_KEY }}" \
            --set-string adpulse.secrets.trackingSecret="${{ secrets.TRACKING_SECRET }}" \
            --set-string adpulse.secrets.gcpProjectId="${{ vars.GCP_PROJECT_ID_STAGE }}"


    integration-test:
      needs: deploy
      runs-on: ubuntu-latest
      steps:
        - name: sleep 2 minutes
          run: sleep 120

        - name: Checkout code
          uses: actions/checkout@v2
          with:
            ref: stage
            fetch-depth: 5

        - name: Run integration tests
          run: |
            pip install requests
            AD_MANAGER_HOST="${{ vars.AD_MANAGER_URL_STAGE || 'http://34.67.120.91:5000' }}" \
            AD_SERVER_HOST="${{ vars.AD_SERVER_URL_STAGE || 'http://34.31.128.115:8080' }}" \
              python -m unittest integration_test -v