name: Deploy to Production

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy:
        # Deploys only when the repo variable DEPLOY_ENABLED is "true", or when
        # started by hand. It needs the GCP secrets and variables the steps below
        # read. Without them the job is skipped instead of failing every push.
        if: ${{ vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
        runs-on: ubuntu-latest

        steps:
        - name: Checkout repository
          uses: actions/checkout@v4
    
        - name: Authenticate with Google Cloud
          uses: google-github-actions/auth@v2
          with:
            credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

        - name: Set up the Google Cloud SDK and kubectl
          uses: google-github-actions/setup-gcloud@v2
          with:
            project_id: ${{ vars.GCP_PROJECT_ID_PROD }}
            install_components: kubectl,gke-gcloud-auth-plugin

        - name: Set up Kubernetes cluster context
          run: gcloud container clusters get-credentials ${{ vars.GCP_CLUSTER_NAME_PROD }} --zone ${{ vars.GCP_CLUSTER_ZONE_PROD}} --project ${{ vars.GCP_PROJECT_ID_PROD }}
    
        - name: Check the service URLs are set
          # There are no built-in addresses to fall back on, so a missing variable has to stop the deploy here
          # instead of putting an empty URL into every service.
          env:
            AD_SERVER_URL: ${{ vars.AD_SERVER_URL_PROD }}
            AD_MANAGER_URL: ${{ vars.AD_MANAGER_URL_PROD }}
            ENGAGEMENT_URL: ${{ vars.ENGAGEMENT_URL_PROD }}
          run: |
            for name in AD_SERVER_URL AD_MANAGER_URL ENGAGEMENT_URL; do
              if [ -z "${!name}" ]; then echo "Set the repository variable ${name}_PROD (Settings, Secrets and variables, Actions)."; exit 1; fi
            done

        - name: Upgrade Helm chart
          # Credentials come from repo/environment secrets, never from values.yaml
          # (see ad-devops/helm/ad-pulse/templates/secrets.yaml). Configure these
          # under Settings > Secrets and variables > Actions before this runs.
          run: |
            helm upgrade --install main ./ad-devops/helm/ad-pulse --values ./ad-devops/helm/ad-pulse/values.yaml --namespace=adpulse \
              --set ad_server_url="${{ vars.AD_SERVER_URL_PROD }}" \
              --set ad_manager_url="${{ vars.AD_MANAGER_URL_PROD }}" \
              --set ad_engagement_svc_clk="${{ vars.ENGAGEMENT_URL_PROD }}/engagement/clk" \
              --set ad_engagement_svc_rndr="${{ vars.ENGAGEMENT_URL_PROD }}/engagement/csc" \
              --set-string adpulse.secrets.databaseUrl="${{ secrets.DATABASE_URL_PROD }}" \
              --set-string adpulse.secrets.mongodbUri="${{ secrets.MONGODB_URI_PROD }}" \
              --set-string adpulse.secrets.redisHost="${{ secrets.REDIS_HOST_PROD }}" \
              --set-string adpulse.secrets.redisPort="${{ secrets.REDIS_PORT_PROD }}" \
              --set-string adpulse.secrets.redisUsername="${{ secrets.REDIS_USERNAME_PROD }}" \
              --set-string adpulse.secrets.redisPassword="${{ secrets.REDIS_PASSWORD_PROD }}" \
              --set-string adpulse.secrets.supabaseUrl="${{ secrets.SUPABASE_URL }}" \
              --set-string adpulse.secrets.supabaseKey="${{ secrets.SUPABASE_KEY }}" \
              --set-string adpulse.secrets.trackingSecret="${{ secrets.TRACKING_SECRET }}" \
              --set-string adpulse.secrets.managerApiKey="${{ secrets.MANAGER_API_KEY }}" \
              --set-string adpulse.secrets.gcpProjectId="${{ vars.GCP_PROJECT_ID_PROD }}"

    integration-test:
      needs: deploy
      runs-on: ubuntu-latest
      steps:
        - name: sleep 2 minutes
          run: sleep 120

        - name: Checkout code
          uses: actions/checkout@v4

        - name: Run integration tests against prod
          run: |
            pip install requests
            AD_MANAGER_API_KEY="${{ secrets.MANAGER_API_KEY }}" \
            AD_MANAGER_HOST="${{ vars.AD_MANAGER_URL_PROD }}" \
            AD_SERVER_HOST="${{ vars.AD_SERVER_URL_PROD }}" \
              python -m unittest integration_test -v