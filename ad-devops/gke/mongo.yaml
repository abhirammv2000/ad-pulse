# MongoDB as a one-member replica set on a persistent disk. Google Cloud has no managed MongoDB, so it runs in the
# cluster. The subscriber needs a replica set because it counts events in transactions.
apiVersion: v1
kind: Namespace
metadata: {name: adpulse-data}
---
apiVersion: v1
kind: Service
metadata: {name: mongodb, namespace: adpulse-data}
spec:
  clusterIP: None
  selector: {app: mongodb}
  ports: [{port: 27017}]
  # The member's address is this name, and the pod is only ready once the set exists.
  publishNotReadyAddresses: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: mongodb, namespace: adpulse-data}
spec:
  serviceName: mongodb
  replicas: 1
  selector: {matchLabels: {app: mongodb}}
  template:
    metadata: {labels: {app: mongodb}}
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          args: [--replSet, rs0, --bind_ip_all]
          ports: [{containerPort: 27017}]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts: [{name: data, mountPath: /data/db}]
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb-0.mongodb.adpulse-data.svc.cluster.local:27017'}]}) }; quit(db.hello().isWritablePrimary ? 0 : 1)"
            periodSeconds: 5
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard-rwo
        resources: {requests: {storage: 10Gi}}
