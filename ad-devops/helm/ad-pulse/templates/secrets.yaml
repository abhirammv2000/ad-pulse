{{/*
Credentials for every service, in one Secret.

None of these have defaults on purpose. The old app.env/db.py/redis.py files
baked live Postgres, Redis, MongoDB and Supabase credentials straight into the
source, and a fallback here would just recreate that. Supply real values with
your own values-secrets.yaml (gitignored) via `-f`, or `--set-string
adpulse.secrets.xxx=...` from CI secrets, as main.yaml/build_push.yml do.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.adpulse.fullname }}-secrets
  namespace: {{ .Values.adpulse.namespace.name }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.adpulse.secrets.databaseUrl | quote }}
  MONGODB_URI: {{ .Values.adpulse.secrets.mongodbUri | quote }}
  REDIS_HOST: {{ .Values.adpulse.secrets.redisHost | quote }}
  REDIS_PORT: {{ .Values.adpulse.secrets.redisPort | quote }}
  REDIS_USERNAME: {{ .Values.adpulse.secrets.redisUsername | quote }}
  REDIS_PASSWORD: {{ .Values.adpulse.secrets.redisPassword | quote }}
  SUPABASE_URL: {{ .Values.adpulse.secrets.supabaseUrl | quote }}
  SUPABASE_KEY: {{ .Values.adpulse.secrets.supabaseKey | quote }}
  TRACKING_SECRET: {{ .Values.adpulse.secrets.trackingSecret | default "" | quote }}
  # The manager reads API_KEY. Its callers send the same value as AD_MANAGER_API_KEY. Empty leaves the manager open.
  API_KEY: {{ .Values.adpulse.secrets.managerApiKey | default "" | quote }}
  AD_MANAGER_API_KEY: {{ .Values.adpulse.secrets.managerApiKey | default "" | quote }}
  GCP_PROJECT_ID: {{ .Values.adpulse.secrets.gcpProjectId | quote }}
  {{- with .Values.adpulse.secrets.pubsubEmulatorHost }}
  # Only for trying the chart without a Google Cloud project. The engagement services then talk to this emulator
  # and need no credentials. Leave it empty in a real deployment.
  PUBSUB_EMULATOR_HOST: {{ . | quote }}
  {{- end }}
