# Stand-ins for what a real deployment gets from managed services: Postgres, Redis, MongoDB and a Pub/Sub emulator,
# plus a job that creates the topics and subscriptions. For trying the chart on a local cluster only, with no
# volumes, so the data goes when the pods do. See ad-devops/README.md.
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: adpulse-verify}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - {name: POSTGRES_DB, value: adpulse}
            - {name: POSTGRES_USER, value: adpulse}
            - {name: POSTGRES_PASSWORD, value: adpulse}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, adpulse]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: adpulse-verify}
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis, namespace: adpulse-verify}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: [redis-cli, ping]}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: adpulse-verify}
spec:
  selector: {app: redis}
  ports: [{port: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mongodb, namespace: adpulse-verify}
spec:
  replicas: 1
  selector: {matchLabels: {app: mongodb}}
  template:
    metadata: {labels: {app: mongodb}}
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports: [{containerPort: 27017}]
          readinessProbe:
            exec: {command: [mongosh, --quiet, --eval, "db.adminCommand('ping')"]}
            periodSeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: mongodb, namespace: adpulse-verify}
spec:
  selector: {app: mongodb}
  ports: [{port: 27017}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pubsub-emulator, namespace: adpulse-verify}
spec:
  replicas: 1
  selector: {matchLabels: {app: pubsub-emulator}}
  template:
    metadata: {labels: {app: pubsub-emulator}}
    spec:
      containers:
        - name: emulator
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
          command: [gcloud, beta, emulators, pubsub, start, "--host-port=0.0.0.0:8085", "--project=adpulse-local"]
          ports: [{containerPort: 8085}]
          readinessProbe:
            tcpSocket: {port: 8085}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: pubsub-emulator, namespace: adpulse-verify}
spec:
  selector: {app: pubsub-emulator}
  ports: [{port: 8085}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: pubsub-init, namespace: adpulse-verify}
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.9.1
          command:
            - sh
            - -c
            - |
              set -e
              base=http://pubsub-emulator:8085/v1/projects/adpulse-local
              put() {
                code=$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$@")
                case "$code" in 200|201|409) ;; *) echo "PUT $1 failed: HTTP $code" >&2; exit 1 ;; esac
              }
              put "$base/topics/click-service-topic"
              put "$base/topics/csc-service-topic"
              put "$base/subscriptions/click-service-topic-sub" -H 'Content-Type: application/json' -d '{"topic":"projects/adpulse-local/topics/click-service-topic"}'
              put "$base/subscriptions/csc-service-topic-sub" -H 'Content-Type: application/json' -d '{"topic":"projects/adpulse-local/topics/csc-service-topic"}'
              echo "topics and subscriptions ready"
