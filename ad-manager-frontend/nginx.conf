server {
    # Port 3000 to match the Service targetPort the Helm chart already uses.
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable; the shell and runtime config are not.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Single-page app: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
